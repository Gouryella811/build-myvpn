name: Build MyVpn CI (Scripts + libbox + Android Debug APK)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SINGBOX_VERSION: "1.12.12"
  GO_VERSION: "1.23.6"
  GRADLE_VERSION: "8.9"

jobs:
  deploy-script-tests:
    name: VPS Deploy Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck -S warning deploy-scripts/install_singbox.sh

      - name: Verify Android asset matches deploy script
        run: diff -u deploy-scripts/install_singbox.sh android/app/src/main/assets/install_singbox.sh

      - name: Run automated mock deploy & BBR matrix tests
        run: bash deploy-scripts/tests/test_install_script.sh

  android-build:
    name: Build libbox.aar & Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache compiled libbox.aar
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-${{ env.SINGBOX_VERSION }}-go-${{ env.GO_VERSION }}

      - name: Build libbox.aar from official sing-box v${{ env.SINGBOX_VERSION }}
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs /tmp/build-libbox
          git clone --branch "v${SINGBOX_VERSION}" --depth 1 https://github.com/SagerNet/sing-box.git /tmp/build-libbox/sing-box
          cd /tmp/build-libbox/sing-box
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.5
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.5
          gomobile init
          go run ./cmd/internal/build_libbox -target android -platform android/arm64,android/amd64
          cp libbox.aar "${GITHUB_WORKSPACE}/android/app/libs/libbox.aar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Kotlin unit tests & assemble Debug APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-myvpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
