[package]
name = "build-myvpn-desktop"
version = "1.1.3"
description = "Build MyVpn — Free, open-source self-hosted VPS VPN client for Windows & macOS"
authors = ["Build MyVpn Contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "build_myvpn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
russh = "0.50"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
futures-util = "0.3"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
